version: 2
updates:
  # Maintain Composer dependencies (grouped into single PR)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      composer-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"

  # Maintain NPM dependencies (grouped into single PR)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    schedule-options:
      cooldown: 7
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"

  # Maintain GitHub Actions dependencies (grouped into single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
